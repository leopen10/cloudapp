# .github/workflows/cd-deploy.yml
# Deploiement en production (Docker Swarm, serveur unique).
#
# Declenchement MANUEL tant qu'aucun serveur n'est provisionne.
# Le champ image_tag sert aussi de retour arriere : indiquer le SHA d'un ancien commit.
#
# Pour rebrancher le deploiement automatique apres chaque CI reussie, remplacer le bloc "on:" par :
#   on:
#     workflow_run:
#       workflows: ['CI — Build & Push']
#       types: [completed]
# et ajouter au job : if: ${{ github.event.workflow_run.conclusion == 'success' }}
#
# Secrets GitHub necessaires :
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY,
#   SERVER_HOST_KEY (ligne complete produite par : ssh-keyscan -t ed25519 <ip-du-serveur>),
#   DOCKER_USERNAME, POSTGRES_PASSWORD, JWT_SECRET_KEY, GRAFANA_ADMIN_PASSWORD,
#   RESEND_API_KEY (facultatif), SLACK_WEBHOOK_URL (facultatif).
# Mots de passe : lettres et chiffres uniquement (ils sont places dans une URL de connexion).

name: CD — Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag des images (SHA de commit). Vide = commit courant."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:

  deploy:
    name: Deploiement sur le serveur
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      INPUT_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Preparation de la connexion SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploiement Swarm
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_SHA}"
          echo "Deploiement des images au tag : $TAG"
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<REMOTE
          set -euo pipefail
          export DOCKER_USERNAME='${DOCKER_USERNAME}'
          export IMAGE_TAG='${TAG}'
          export POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'
          export JWT_SECRET_KEY='${JWT_SECRET_KEY}'
          export GRAFANA_ADMIN_PASSWORD='${GRAFANA_ADMIN_PASSWORD}'
          export RESEND_API_KEY='${RESEND_API_KEY}'
          cd /opt/cloudapp
          git fetch --all --prune
          git reset --hard origin/main
          docker network create --driver overlay --attachable traefik-public 2>/dev/null || true
          docker stack deploy -c docker-compose.prod.yml cloudapp --with-registry-auth
          docker stack services cloudapp
          REMOTE

      - name: Verification de disponibilite
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${SERVER_HOST}/api/"; then
              echo
              echo "Application disponible"
              exit 0
            fi
            echo "Attente ($i/30)..."
            sleep 10
          done
          echo "L'application ne repond pas apres 5 minutes"
          exit 1

  notify:
    name: Notification Slack
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RESULT: ${{ needs.deploy.result }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}

    steps:
      - name: Notification Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          if [ "$RESULT" = "success" ]; then EMOJI="🚀"; COLOR="good"; else EMOJI="❌"; COLOR="danger"; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"$EMOJI Deploiement : $RESULT\",\"attachments\":[{\"color\":\"$COLOR\",\"fields\":[{\"title\":\"Repository\",\"value\":\"$REPO\",\"short\":true},{\"title\":\"Auteur\",\"value\":\"$ACTOR\",\"short\":true}]}]}"
