# .github/workflows/ci-build-push.yml
# Declenche apres un merge sur main.
# Ordre : build local -> scan Trivy (bloquant) -> login -> push.
# Une image avec une vulnerabilite CRITICAL/HIGH corrigeable n'atteint jamais Docker Hub.
# Images publiees : les 6 services + le frontend (cloudapp-frontend).

name: CI — Build & Push

on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build-all:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            context: ./services
            file: ./services/auth/Dockerfile
          - name: project
            context: ./services
            file: ./services/project/Dockerfile
          - name: billing
            context: ./services
            file: ./services/billing/Dockerfile
          - name: notification
            context: ./services
            file: ./services/notification/Dockerfile
          - name: analytics
            context: ./services
            file: ./services/analytics/Dockerfile
          - name: gateway
            context: ./services
            file: ./services/gateway/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local (sans push) pour le scan
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: cloudapp-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Tag immuable (release protegee) : voir avis GHSA-69fq-xp46-6x23.
      # Pour un epinglage par SHA : git ls-remote https://github.com/aquasecurity/trivy-action refs/tags/0.35.0
      - name: Scan de securite Trivy (bloquant)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: cloudapp-${{ matrix.name }}:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push de l'image (latest + SHA du commit)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cloudapp-${{ matrix.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/cloudapp-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}

  notify:
    name: Notification Slack
    runs-on: ubuntu-latest
    needs: build-all
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RESULT: ${{ needs.build-all.result }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      SHA: ${{ github.sha }}

    steps:
      - name: Notification Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          if [ "$RESULT" = "success" ]; then EMOJI="✅"; COLOR="good"; else EMOJI="❌"; COLOR="danger"; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"$EMOJI Build & Push : $RESULT\",\"attachments\":[{\"color\":\"$COLOR\",\"fields\":[{\"title\":\"Repository\",\"value\":\"$REPO\",\"short\":true},{\"title\":\"Auteur\",\"value\":\"$ACTOR\",\"short\":true},{\"title\":\"Commit\",\"value\":\"$SHA\",\"short\":true}]}]}"
