# .github/workflows/ci-pull-request.yml
# Contrôles exécutés sur chaque pull request vers main :
# lint -> tests unitaires -> scan Trivy des images -> test d'intégration (smoke test réel).

name: CI — Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de ruff
        run: pip install ruff

      # Sélection minimale : erreurs de syntaxe et noms indéfinis.
      # Élargir plus tard (--select E,F,I) une fois le code nettoyé.
      - name: Analyse statique
        run: ruff check services/ --select E9,F63,F7,F82

  unit-tests:
    name: Tests unitaires (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, project, billing, notification, analytics, gateway]

    # Base PostgreSQL jetable : les services ouvrent la base des l'import des tests.
    # Les valeurs ci-dessous n'existent que le temps du test (serveur GitHub).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cloudapp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/cloudapp_db
      PYTHONPATH: ${{ github.workspace }}/services/shared:${{ github.workspace }}/services/${{ matrix.service }}/app

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/app/requirements.txt

      - name: Installation des dépendances du service
        run: pip install -r services/${{ matrix.service }}/app/requirements.txt

      - name: Creation des tables de test
        run: python -c "import database; database.init_db()"

      - name: Lancement des tests unitaires
        run: |
          cd services/${{ matrix.service }}
          python -m pytest tests/ -v --tb=short

  image-scan:
    name: Scan Trivy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            context: ./services
            file: ./services/auth/Dockerfile
          - name: project
            context: ./services
            file: ./services/project/Dockerfile
          - name: billing
            context: ./services
            file: ./services/billing/Dockerfile
          - name: notification
            context: ./services
            file: ./services/notification/Dockerfile
          - name: analytics
            context: ./services
            file: ./services/analytics/Dockerfile
          - name: gateway
            context: ./services
            file: ./services/gateway/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local de l'image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: cloudapp-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan de securite Trivy (bloquant)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: cloudapp-${{ matrix.name }}:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  integration-tests:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Préparation du fichier .env
        run: cp .env.example .env

      - name: Démarrage de la stack (attente de disponibilité)
        run: docker compose -f docker-compose.test.yml up -d --build --wait --wait-timeout 240

      - name: État des services
        run: docker compose -f docker-compose.test.yml ps

      - name: Smoke test — Gateway
        run: curl -fsS http://localhost:8000/ | grep -q '"version"'

      - name: Smoke test — Inscription (Gateway -> Auth -> PostgreSQL)
        run: |
          curl -fsS -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-${GITHUB_RUN_ID}@cloudapp.io\",\"username\":\"ci${GITHUB_RUN_ID}\",\"password\":\"CiTest1234!\",\"full_name\":\"CI Runner\"}"

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 50

      - name: Arrêt des services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  notify:
    name: Notification Slack
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, image-scan, integration-tests]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      LINT: ${{ needs.lint.result }}
      UNIT: ${{ needs.unit-tests.result }}
      SCAN: ${{ needs.image-scan.result }}
      INTEG: ${{ needs.integration-tests.result }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      BRANCH: ${{ github.head_ref }}

    steps:
      - name: Notification Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          if [ "$LINT" = "success" ] && [ "$UNIT" = "success" ] && [ "$SCAN" = "success" ] && [ "$INTEG" = "success" ]; then
            EMOJI="✅"; COLOR="good"; STATUS="tous les contrôles sont passés"
          else
            EMOJI="❌"; COLOR="danger"; STATUS="lint=$LINT tests=$UNIT trivy=$SCAN integration=$INTEG"
          fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"$EMOJI Pull Request : $STATUS\",\"attachments\":[{\"color\":\"$COLOR\",\"fields\":[{\"title\":\"Repository\",\"value\":\"$REPO\",\"short\":true},{\"title\":\"Auteur\",\"value\":\"$ACTOR\",\"short\":true},{\"title\":\"Branche\",\"value\":\"$BRANCH\",\"short\":true}]}]}"
