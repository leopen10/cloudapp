version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}"
      POSTGRES_DB: cloudapp_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cloudapp_db"
      SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY manquant dans .env}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudapp-network

  project:
    build:
      context: ./services
      dockerfile: project/Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cloudapp_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudapp-network

  billing:
    build:
      context: ./services
      dockerfile: billing/Dockerfile
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cloudapp_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudapp-network

  notification:
    build:
      context: ./services
      dockerfile: notification/Dockerfile
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cloudapp_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudapp-network

  analytics:
    build:
      context: ./services
      dockerfile: analytics/Dockerfile
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cloudapp_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudapp-network

  gateway:
    build:
      context: ./services
      dockerfile: gateway/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - auth
      - project
      - billing
      - notification
      - analytics
    networks:
      - cloudapp-network

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - gateway
    networks:
      - cloudapp-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - cloudapp-network
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana-oss:10.2.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant dans .env}"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cloudapp-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:

networks:
  cloudapp-network:
    driver: bridge
